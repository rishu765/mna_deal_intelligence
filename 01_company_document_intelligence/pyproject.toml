[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ma-company-intelligence"
version = "0.1.0"
description = "Evidence-backed company research and document intelligence for M&A workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Maintainer" }]
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=2.0,<3",
  "pydantic>=2.9,<3",
  "pymupdf>=1.24,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
madi-inspect-pdf = "ma_company_intelligence.cli:main"
madi-inspect-chunks = "ma_company_intelligence.chunk_cli:main"
madi-build-index = "ma_company_intelligence.index_cli:main"
madi-retrieve = "ma_company_intelligence.retrieval_cli:main"
madi-answer = "ma_company_intelligence.rag_cli:main"
madi-research = "ma_company_intelligence.research_cli:main"
madi-evaluate = "ma_company_intelligence.evaluation_cli:main"
madi-api = "ma_company_intelligence.api_cli:main"

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_company_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["ma_company_intelligence"]

[tool.coverage.report]
show_missing = true
skip_covered = true

