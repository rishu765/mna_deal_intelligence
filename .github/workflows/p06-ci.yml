name: Project 6 CI

on:
  pull_request:
    paths:
      - "06_mna_deal_intelligence_super_agent/**"
      - ".github/workflows/p06-ci.yml"
  push:
    branches: [main]
    paths:
      - "06_mna_deal_intelligence_super_agent/**"
      - ".github/workflows/p06-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06_mna_deal_intelligence_super_agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06_mna_deal_intelligence_super_agent/pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Verify formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest
