[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ma-precedent-transactions"
version = "1.0.0"
description = "Evidence-grounded precedent transaction research and valuation agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Maintainer" }]
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.2.13,<1.3",
  "pydantic>=2.9,<3",
  "typing-extensions>=4.12,<5",
  "uvicorn>=0.34,<1",
]

[project.scripts]
mapt-discovery-rag-demo = "ma_precedent_transactions.demo:main"
mapt-extraction-demo = "ma_precedent_transactions.demo_m3:main"
mapt-precedent-valuation-demo = "ma_precedent_transactions.demo_m45:main"
mapt-agent-demo = "ma_precedent_transactions.demo_final:main"
mapt-evaluate = "ma_precedent_transactions.evaluation_final:main"
mapt-api = "ma_precedent_transactions.api_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
ai = [
  "langchain-core>=0.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_precedent_transactions"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["ma_precedent_transactions"]
