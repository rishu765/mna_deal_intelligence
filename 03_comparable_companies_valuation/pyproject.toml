[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ma-comparable-valuation"
version = "1.0.0"
description = "Provider-neutral contracts for evidence-backed comparable-company valuation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Maintainer" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
macv-profile-demo = "ma_comparable_valuation.demo_profile:main"
macv-peers-demo = "ma_comparable_valuation.demo_peers:main"
macv-valuation-demo = "ma_comparable_valuation.demo_valuation:main"
macv-api = "ma_comparable_valuation.api_cli:main"
macv-evaluate = "ma_comparable_valuation.evaluation_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ma_comparable_valuation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["ma_comparable_valuation"]
